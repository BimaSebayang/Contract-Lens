server:
  port: 9001

spring:
  application:
    name: SERVICE_GATEWAY

  datasource:
    url: jdbc:postgresql://192.168.8.2:5432/contractlens_gateway
    username: sa
    password: sa
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
          lob.non_contextual_creation: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    mongodb:
      host: 192.168.8.2
      port: 27017
      database: contractlens
      username: contractlens
      password: contractlens123
      authentication-database: admin

    redis:
      host: 192.168.8.2
      port: 7000
      password:
      timeout: 5000ms
      database: 0

      lettuce:
        pool:
          enabled: true

  rabbitmq:
    host: 192.168.8.2
    port: 5672
    username: contractlens_user
    password: contractlens_pass
    virtual-host: /

external:
  analyze-api:
    url:  http://localhost:9002
    name: ANALYZE-API
  contract-lens-api:
    url:  http://127.0.0.1:9004
    name: CONTRACT-LENS-API