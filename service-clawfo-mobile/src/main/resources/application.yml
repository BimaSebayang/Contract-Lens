springdoc:
  swagger-ui:
    doc-expansion: none
    operations-sorter: alpha
    tags-sorter: alpha
    layout: StandaloneLayout
    path: /microsite-swagger
    url: /microsite-swagger-api
  api-docs:
    path: /microsite-swagger-api

logging:
  level:
    org.hibernate.SQL: DEBUG
  pattern:
    console: |
      {
        "timestamp": "%d{yyyy-MM-dd HH:mm:ss}",
        "request": {
          "url": "%X{url}",
          "method": "%X{method}"
        },
        "context": {
          "uuid": "%X{uuid}",
          "user": "%X{user}"
        },
        "source": {
          "class": "%logger{0}",
          "line": "%line"
        },
        "level": "%level",
        "message": "%msg"
      }%n

management:
